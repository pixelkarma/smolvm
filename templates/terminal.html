{{define "terminal.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal · {{.Instance.Name}} · smolvm</title>
  <link rel="stylesheet" href="/static/xterm/xterm.min.css">
  <style>
    html, body { height: 100%; margin: 0; background: #0b1220; }
    body { display: grid; grid-template-rows: auto 1fr; font-family: ui-sans-serif, system-ui, sans-serif; color: #e7edf3; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.08); background: #0f172a; }
    .title { font-weight: 700; }
    .meta { color: #94a3b8; font-size: 13px; }
    #terminal-wrap { min-height: 0; padding: 8px; }
    #terminal { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="title">Terminal</div>
      <div class="meta">{{.Instance.Name}} · {{.Instance.Slug}}</div>
    </div>
  </header>
  <div id="terminal-wrap">
    <div id="terminal"></div>
  </div>
  <script src="/static/xterm/xterm.min.js"></script>
  <script src="/static/xterm/xterm-addon-fit.min.js"></script>
  <script>
    (() => {
      const term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        theme: {
          background: '#0b1220',
          foreground: '#e7edf3'
        }
      });
      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminal'));
      fitAddon.fit();

      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${protocol}://${window.location.host}{{.WebsocketURL}}`);
      ws.binaryType = 'arraybuffer';

      const encoder = new TextEncoder();
      const decoder = new TextDecoder();

      function sendResize() {
        fitAddon.fit();
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: 'resize',
            cols: term.cols,
            rows: term.rows
          }));
        }
      }

      ws.addEventListener('open', () => {
        sendResize();
        term.focus();
      });

      ws.addEventListener('message', (event) => {
        if (typeof event.data === 'string') {
          term.write(event.data);
          return;
        }
        term.write(decoder.decode(event.data));
      });

      ws.addEventListener('close', () => {
        term.writeln('\r\n[connection closed]');
      });

      ws.addEventListener('error', () => {
        term.writeln('\r\n[connection error]');
      });

      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data }));
        }
      });

      window.addEventListener('resize', sendResize);
      setTimeout(sendResize, 0);
    })();
  </script>
</body>
</html>
{{end}}
